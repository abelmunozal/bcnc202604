# Gradle Configuration
# The Java version used to COMPILE and RUN the app is pinned via the Gradle Java
# Toolchain in build.gradle.kts (Temurin 21), auto-provisioned by the foojay
# resolver. Gradle itself only needs any supported JDK (17+) on the PATH to start.

# Performance optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
